<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-hk" lang="zh-hk">

<head>
  <title>登入 | 反詐騙協調中心 (ADCC)</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="user-scalable=yes, width=device-width, initial-scale=1.0, maximum-scale=2.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="shortcut icon" type="image/png" href="/image/favicon.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PMingLiU", "MingLiU", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2faff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    /* 顶部品牌 */
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand img {
      height: 72px;
      margin-bottom: 12px;
    }

    .login-brand h1 {
      font-size: 20px;
      color: #07776e;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .login-brand p {
      font-size: 14px;
      color: #888;
      margin-top: 6px;
    }

    /* 登录卡片 */
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
      padding: 36px 32px;
      border: 1px solid #e8e8e8;
    }

    .login-card label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      color: #333;
      background: #fafafa;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: #07776e;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(7, 119, 110, 0.1);
    }

    .input-wrap .toggle-pw {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 18px;
      padding: 8px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .input-wrap .toggle-pw:hover {
      color: #555;
    }

    .login-card .btn-login {
      width: 100%;
      height: 48px;
      background: #07776e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 12px;
    }

    .login-card .btn-login:hover {
      background: #06655d;
    }

    .login-card .btn-login:active {
      transform: scale(0.98);
    }

    .login-card .btn-login:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* 错误提示 */
    .login-error {
      text-align: center;
      font-size: 13px;
      color: #990f29;
      min-height: 20px;
      margin-bottom: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .login-error.show {
      opacity: 1;
    }

    /* 底部 */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #aaa;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        border-radius: 10px;
      }

      .login-brand img {
        height: 56px;
      }

      .login-brand h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <!-- 品牌 -->
    <div class="login-brand">
      <img src="/image/logo.png" alt="反詐騙協調中心" />
      <h1>反詐騙協調中心</h1>
      <p>Anti-Deception Coordination Centre</p>
    </div>

    <!-- 登录卡片 -->
    <div class="login-card">
      <label for="passwordInput">請輸入密碼以繼續</label>
      <div class="input-wrap">
        <input
          type="password"
          id="passwordInput"
          placeholder="請輸入密碼"
          autocomplete="off"
          autofocus
        />
        <button class="toggle-pw" id="togglePw" type="button" title="顯示密碼">
          👁
        </button>
      </div>
      <div class="login-error" id="loginError">密碼錯誤，請重試</div>
      <button class="btn-login" id="btnLogin" type="button">登 入</button>
    </div>

    <div class="login-footer">
      &copy; 反詐騙協調中心 ADCC · 香港警務處
    </div>
  </div>

  <script src="/js/auth-check.js"></script>
  <script>
    (function () {
      const input = document.getElementById("passwordInput");
      const toggle = document.getElementById("togglePw");
      const btn = document.getElementById("btnLogin");
      const error = document.getElementById("loginError");

      // 如果已登录，直接跳转
      if (ADCC_Auth.isLoggedIn()) {
        redirectToTarget();
        return;
      }

      // 显示/隐藏密码
      toggle.addEventListener("click", function () {
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        toggle.textContent = isPassword ? "🙈" : "👁";
      });

      // 回车登录
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") doLogin();
      });

      // 按钮登录
      btn.addEventListener("click", doLogin);

      async function doLogin() {
        const password = input.value.trim();
        if (!password) {
          showError("請輸入密碼");
          return;
        }

        btn.disabled = true;
        btn.textContent = "驗證中…";
        error.classList.remove("show");

        // 给一点延迟让 UI 更新
        await new Promise((r) => setTimeout(r, 300));

        const ok = await ADCC_Auth.login(password);
        if (ok) {
          btn.textContent = "✓ 登入成功";
          btn.style.background = "#4caf50";
          setTimeout(redirectToTarget, 400);
        } else {
          showError("密碼錯誤，請重試");
          btn.disabled = false;
          btn.textContent = "登 入";
          input.value = "";
          input.focus();
        }
      }

      function showError(msg) {
        error.textContent = msg;
        error.classList.add("show");
        input.style.borderColor = "#990f29";
        setTimeout(function () {
          input.style.borderColor = "#e0e0e0";
          error.classList.remove("show");
        }, 2500);
      }

      function redirectToTarget() {
        // 从 URL 参数获取跳转目标
        const params = new URLSearchParams(window.location.search);
        const returnUrl = params.get("return");
        // 默认跳转到首页
        window.location.href = returnUrl || "/page_raw.html";
      }
    })();
  </script>

</body>
</html>
